<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Stylized G and T waveform emblem with graduation / AI sparkles -->
  <g filter="url(#shadow)" transform="translate(48, 52)">
    <!-- Shield / Core Wave Arc -->
    <path d="M 208 40 C 310 40 376 110 376 210 C 376 295 315 365 215 370 C 130 374 56 312 48 226 C 42 160 84 94 148 58" fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round"/>
    
    <!-- Central T / Tower of Employment -->
    <path d="M 120 150 L 296 150 M 208 150 L 208 330" fill="none" stroke="url(#accentGrad)" stroke-width="30" stroke-linecap="round"/>

    <!-- Emerging wave / Tarang -->
    <path d="M 88 280 Q 150 210 212 280 T 336 280" fill="none" stroke="#38BDF8" stroke-width="16" stroke-linecap="round"/>
    
    <!-- AI Brain Sparkle top right -->
    <polygon points="352,48 360,72 384,80 360,88 352,112 344,88 320,80 344,72" fill="#FBBF24" />
    <polygon points="100,70 105,85 120,90 105,95 100,110 95,95 80,90 95,85" fill="#67E8F9" />
  </g>

  <!-- Brand Typography -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">GRAM TARANG</text>
  <text x="256" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#93C5FD" text-anchor="middle" letter-spacing="2">AI &amp; SKILLS PORTAL</text>
</svg>
